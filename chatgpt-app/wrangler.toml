name = "henshin-hisho-chatgpt"
main = "src/index.js"
compatibility_date = "2026-10-22"

# 接続先は https://<ホスト>/mcp 。料金ページは /price/ 。
# デプロイ前に KV を作り、下の id を差し替える:
#   npx wrangler kv namespace create CHATGPT_KV
# シークレット（値はここに書かない）:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put STRIPE_PRICE_ID
#   npx wrangler secret put MCP_ACCESS_TOKEN
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put OAUTH_ADMIN_KEY
#   npx wrangler secret put INCOMING_FORWARD_TOKEN
#   npx wrangler secret put MCP_OAUTH_CONSENT_KEY
#   npx wrangler secret put INTERNAL_DRAFT_TOKEN
#   npx wrangler secret put MAIL_TOKEN_ENCRYPTION_KEY
#   npx wrangler secret put MS_CLIENT_ID
#   npx wrangler secret put MS_CLIENT_SECRET
# Gmail のクライアント ID は linebot と同じ公開値。スコープは gmail.send + openid + email。
# 受信は Email Routing が email() に渡す。send_email バインディングは使わない。
# Microsoft の送信を有効にするときは vars に MS_OAUTH_ENABLED = "1" を足す。
# 送信済みの返信検出を動かすときは次を足す。
# [triggers]
# crons = ["*/15 * * * *"]

[vars]
GOOGLE_CLIENT_ID = "899798982543-2jk3d2fp97c02js71opg7l1j9fa7oh5a.apps.googleusercontent.com"
GOOGLE_REDIRECT_URI = "https://reply.kimitotalk.link/oauth/google/callback"
WORKER_PUBLIC_URL = "https://reply.kimitotalk.link"

[observability]
enabled = true

[observability.traces]
enabled = true

[[kv_namespaces]]
binding = "CHATGPT_KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000001"
