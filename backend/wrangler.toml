# 契約を全画面で揃えるときに足すシークレット（値はここに書かない）:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_PRICE_ID
#   npx wrangler secret put STRIPE_ANNUAL_PRICE_ID
#   npx wrangler secret put INTERNAL_ENTITLEMENT_TOKEN
#   npx wrangler secret put PLAY_ACCESS_TOKEN
#   npx wrangler secret put GOOGLE_PLAY_SA_JSON
#   npx wrangler secret put APPLE_IAP_TRUST_JWK
# プレーンテキスト（既定は空。外部購入リンクはオフ）:
#   CHATGPT_APP_URL = "https://reply.kimitotalk.link"
#   APPLE_EXTERNAL_PURCHASE_LINK = "1" は、審査済みビルドでリンクを出すときだけ
#   PLAY_PACKAGE_NAME は変えるときだけ。既定は jp.besttrust.henshinhisho
name = "henshin-hisho-app"
main = "src/index.js"
compatibility_date = "2026-07-06"

[[kv_namespaces]]
binding = "APP_KV"
id = "a6abebe460104b2d9324d88f6ed40c2d"
preview_id = "ea7961a933cf4bc5912c960a20d6d397"

[[d1_databases]]
binding = "PROJECT_DB"
database_name = "henshin-hisho-projects"
database_id = "5b7f2c60-0abd-4467-ad22-633d19e03c65"

[triggers]
crons = ["0 * * * *"]
